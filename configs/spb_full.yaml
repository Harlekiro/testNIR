# Санкт-Петербург целиком. Данные: архив blocksnet-data, папка cities/saint_petersburg/data → data/spb_full/
# (около 150 МБ, в git не входит — автор кладёт сама). Все слои в градусах (EPSG:4326).
name: spb_full
title: Санкт-Петербург
mode: layers
rules: v5
blocks: ../data/spb_full/blocks.geojson
block_id_field:             # поля номера нет: номер квартала = порядок в blocks.geojson, с 0 (ТЗ 4.1.3);
                            # совпадает с block_id вырезки Васильевского острова
buildings: ../data/spb_full/buildings.geojson
fields:
  footprint: building_area
  is_living: is_living
  storeys: storeys_count
  living_area: living_area
  population: population_balanced
services: ../data/spb_full/services      # папка: один файл = один тип сервиса
capacity_field: capacity
zones: ../data/spb_full/functional_zones.geojson
zone_field: functional_zone
zone_rules:                 # ТЗ 4.4.1: ТП1–ТП4, ТПД1, ТПД2 → производственная; ТД1-1 … ТД3 → общественно-деловая
  - [ТП, П]
  - [ТД, ОД]
territory: [8346, 9366, 2059]   # промзона у наб. Макарова
params:
  kit: 1.4                  # КИТ из ПЗЗ (4.6.2, п. 1)
  kit_source: ПЗЗ Санкт-Петербурга, зоны ТСМ и ТД1-1
  stat_jobs: 1472900        # проверка 4.8.4
param_sources:
  stat_jobs: Петростат, 2022 — работники организаций без малого бизнеса
