# Настройки набора данных «vysotsk». Черновик составлен командой init по папке:
#   examples/vysotsk (Высоцкое городское поселение, архив от 29.10.2026)
# Пути указаны относительно этого файла. Строки с пометкой «ПРОВЕРЬТЕ» программа угадала —
# проверьте их и запустите:  python -m mixuse check configs/vysotsk.yaml

name: vysotsk
mode: layers            # layers — отдельные слои; table — готовая таблица кварталов (как у Гатчины)

blocks: ../examples/vysotsk/blocks.geojson   # ПРОВЕРЬТЕ: кварталы; 473 объектов, UTM зона 35N (EPSG:32635)
block_id_field:          # поля номера нет — номер квартала = порядок в файле (0, 1, 2…)

buildings: ../examples/vysotsk/building.geojson   # ПРОВЕРЬТЕ: здания; 1007 объектов, градусы (EPSG:4326)
fields:                  # имена полей в слое зданий; есть поля: с.ш, в.д, address, number_of_floors, footprint_area, is_living, living_area, non_living_area, build_floor_area, population
  footprint: footprint_area # ПРОВЕРЬТЕ: площадь застройки, м² (нет — по контуру)
  is_living: is_living    # ПРОВЕРЬТЕ: жилое: 1/0 или да/нет
  storeys: number_of_floors # ПРОВЕРЬТЕ: этажность (нет — 1 этаж)
  living_area: living_area # ПРОВЕРЬТЕ: жилая площадь, м² (нет — A·k_liv)
  population: population  # ПРОВЕРЬТЕ: жители (нет — жилая площадь ÷ q)

services:               # папка «один файл = один тип сервиса»; тип = имя файла
  - ../examples/vysotsk/Cервисы   # ПРОВЕРЬТЕ: 30 типов, из них в таблице групп: bank, bus_stop, cafe, convenience, kindergarten, library, mfz, post_office, school, supermarket
  # - ../examples/vysotsk/Промышленность   # не подключено: energy
  # - ../examples/vysotsk/Сценарий   # не подключено: building, landuse
service_groups:          # своя таблица «тип сервиса → группа» (CSV); пусто — встроенная таблица

zones: ../examples/vysotsk/landuse.geojson   # ПРОВЕРЬТЕ: зоны; 279 объектов, градусы (EPSG:4326)
zone_field: Зона   # ПРОВЕРЬТЕ: поле кода зоны; текстовые поля: Зона, Тип
zone_rules:              # нежилое здание без сервисов: «код зоны начинается с …» → группа (К, ОД, П); иначе X
  # ПРОВЕРЬТЕ: правила предложены по названиям зон, автор должен подтвердить
  - [Производственная, П]
  - [Общественно-деловая, ОД]
  # коды зон в слое (9):
  #   Зона лесопользования  (129)
  #   Жилая зона  (59)
  #   Зона рекреационного назначения  (31)
  #   Производственная зона, зона инженерной и транспортной инфраструктуры  (21)
  #   Общественно-деловая зона  (14)
  #   Зона специального назначения  (13)
  #   Водные объекты  (6)
  #   Зона размещения военных объектов  (4)
  #   Зона сельскохозяйственного использования  (2)

territory: []            # номера кварталов территории, например [12, 13]; номера — в results/<код>_кварталы.geojson

params:                  # параметры метода; раскомментируйте, чтобы изменить значение по умолчанию
  # kit: 1.4                # КИТ — поэтажная площадь ÷ площадь территории
  # kit_max: 2.5            # предельный КИТ (сигнал)
  # R: 800                  # радиус окружения, м
  # r: 500                  # пешая доступность, м
  # q: 30                   # м² жилой площади на жителя
  # k_liv: 0.7              # доля жилой площади в поэтажной
  # a_К: 35                 # м² на рабочее место, К
  # a_ОД: 20                # м² на рабочее место, ОД
  # a_П: 70                 # м² на рабочее место, П
  # a_X: 50                 # м² на рабочее место, X
  # n_school: 110           # мест в школах на 1000 жителей
  # n_kinder: 60            # мест в садах на 1000 жителей
  # S_min: 200              # минимальная площадь застройки нежилого здания, м²
  # storeys_default: 1      # этажность, если не указана
  # r_szz: 300              # радиус проверки «производство рядом», м
  # builtin: да             # учитывать встроенные помещения
  # builtin_s0: 100         # площадь одного встроенного помещения, м²
  # builtin_share: 0.5      # предельная доля первого этажа
  # builtin_min_storeys: 2  # минимальная этажность дома

scenarios:               # варианты: доли поэтажной площади, %, по группам Ж, К, ОД, П
  "С0 Ж+К": {Ж: 85, К: 15, ОД: 0, П: 0}
  "С1 Ж+ОД": {Ж: 60, К: 10, ОД: 30, П: 0}
  "С2 ОД+П": {Ж: 0, К: 10, ОД: 40, П: 50}
  "С3 Ж+П": {Ж: 50, К: 10, ОД: 0, П: 40}

# Не использовано (программе не нужно или не распознано):
#   ../examples/vysotsk/boundary.geojson — 1 объектов, poly
#   ../examples/vysotsk/lake.geojson — 18 объектов, poly
#   ../examples/vysotsk/railways.geojson — 71 объектов, None
#   ../examples/vysotsk/roads.geojson — 316 объектов, None
#   ../examples/vysotsk/water.geojson — 1 объектов, poly
#   ../examples/vysotsk/Промышленность/
#   ../examples/vysotsk/Сценарий/
