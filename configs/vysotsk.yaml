# Высоцк. Данные — data/vysotsk/ архива метод_сравнения_вариантов_v4.zip (кварталы пересохранены в EPSG:4326).
# Соответствует примеру 'vysotsk' ноутбука v4. Папка «Сценарий» в расчёте не используется.
name: vysotsk
title: Высоцк
mode: layers
blocks: ../examples/vysotsk/кварталы.geojson
block_id_field:             # поля номера нет: номер = порядок объекта в кварталы.geojson, с 0 (другой файл не брать)
buildings: ../examples/vysotsk/здания.geojson
fields:
  footprint: footprint_area
  is_living: is_living
  storeys: number_of_floors
  living_area: living_area
  population: population
services:                   # две папки: один файл = один тип сервиса
  - ../examples/vysotsk/сервисы
  - ../examples/vysotsk/промышленность
capacity_field: capacity
zones: ../examples/vysotsk/зоны.geojson
zone_field: Зона
zone_rules:                 # «Производственная…» → П, «Общественно-деловая…» → ОД, остальное → X
  - [Производственная, П]
  - [Общественно-деловая, ОД]
territory: [362, 387, 392]  # 7,1 га; производственные кварталы у жилой застройки — пример, не утверждённый проект
params: {}
